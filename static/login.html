<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/h21-favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/static/brand/h21-favicon.svg">
  <link rel="apple-touch-icon" href="/static/brand/h21-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>H21 — Login</title>
  <meta property="og:title" content="H21 — 21 Questions">
  <meta property="og:description" content="A daily 21 Questions trivia game powered by AI.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="__BASE_URL__/static/brand/h21-og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1 class="brand-heading"><img class="brand-logo" src="/static/brand/h21-logo.svg" alt="H21" width="590" height="180"></h1>
    <p class="subtitle">21 Questions</p>

    <div id="login-section" class="auth-section">
      <h2>Log in</h2>
      <form id="login-form">
        <div class="settings-field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" autocomplete="username" maxlength="40" required>
        </div>
        <div class="settings-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="login-btn">Log in</button>
        <p id="login-status" hidden></p>
      </form>
    </div>

    <div id="register-section" class="auth-section">
      <h2>Register</h2>
      <form id="register-form">
        <div class="settings-field">
          <label for="register-username">Username</label>
          <input type="text" id="register-username" autocomplete="username" maxlength="40" required>
        </div>
        <div class="settings-field">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" autocomplete="new-password" minlength="4" required>
        </div>
        <div class="settings-field">
          <label for="register-invite">Invite code</label>
          <input type="text" id="register-invite" autocomplete="off" maxlength="20" required>
        </div>
        <button type="submit" id="register-btn">Register</button>
        <p id="register-status" hidden></p>
      </form>
    </div>

    <div id="invite-request-section" class="auth-section">
      <h2>Request an Invite</h2>
      <form id="invite-request-form">
        <div class="settings-field">
          <label for="invite-request-contact" id="invite-request-label">Email</label>
          <input type="text" id="invite-request-contact" autocomplete="off" maxlength="200" required>
        </div>
        <button type="submit" id="invite-request-btn">Request</button>
        <p id="invite-request-status" hidden></p>
      </form>
    </div>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
