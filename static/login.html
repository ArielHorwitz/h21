<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/h21-favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/static/brand/h21-favicon.svg">
  <link rel="apple-touch-icon" href="/static/brand/h21-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>H21 — Login</title>
  <meta property="og:title" content="H21 — 21 Questions">
  <meta property="og:description" content="A daily 21 Questions trivia game powered by AI.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="__BASE_URL__/static/brand/h21-og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="login-page">
    <h1 class="brand-heading"><img class="brand-logo" src="/static/brand/h21-logo.svg" alt="H21" width="590" height="180"></h1>
    <p class="login-tagline">A daily game of 21 questions. Guess what the AI is thinking of.</p>

    <section class="login-card">
      <div class="segmented" role="tablist">
        <button type="button" role="tab" id="login-tab" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="register-tab" aria-selected="false">Join with an invite</button>
      </div>

      <form id="login-form" class="login-form">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" autocomplete="username" maxlength="40" required>
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
        <button type="submit" id="login-btn" class="primary-btn">Log in</button>
        <p id="login-status" hidden></p>
      </form>

      <form id="register-form" class="login-form" hidden>
        <label for="register-invite">Invite code</label>
        <input type="text" id="register-invite" autocomplete="off" maxlength="20" required>
        <label for="register-username">Choose a username</label>
        <input type="text" id="register-username" autocomplete="username" maxlength="40" required>
        <label for="register-password">Choose a password</label>
        <input type="password" id="register-password" autocomplete="new-password" minlength="4" required>
        <button type="submit" id="register-btn" class="primary-btn">Join</button>
        <p id="register-status" hidden></p>
      </form>
    </section>

    <section class="invite-request">
      <button type="button" class="text-btn" id="invite-request-toggle">No invite? Request one</button>
      <form id="invite-request-form" class="login-form" hidden>
        <label for="invite-request-contact" id="invite-request-label">Email</label>
        <div class="inline-form">
          <input type="text" id="invite-request-contact" autocomplete="off" maxlength="200" required>
          <button type="submit" id="invite-request-btn" class="primary-btn">Request</button>
        </div>
        <p id="invite-request-status" hidden></p>
      </form>
    </section>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
