<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/h21-favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/static/brand/h21-favicon.svg">
  <link rel="apple-touch-icon" href="/static/brand/h21-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>H21 — 21 Questions</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="nav-bar">
    <a href="/" title="Home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg></a>
    <a href="/help" title="Help"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 9a3 3 0 115.12 2.12C13.24 12 12 12.5 12 14"/><circle cx="12" cy="18" r="0.5" fill="currentColor"/></svg></a>
    <a href="/account" title="Account" id="nav-account"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.418 3.582-7 8-7s8 2.582 8 7"/></svg></a>
  </nav>
  <main>
    <h1 class="brand-heading"><a href="/" class="home-link"><img class="brand-logo" src="/static/brand/h21-logo.svg" alt="H21" width="590" height="180"></a></h1>
    <p class="subtitle" id="game-subtitle">21 Questions</p>
    <p class="date" id="today-date"></p>

    <div id="game-area">
      <div id="question-log"></div>

      <aside id="hint-panel" hidden>
        <h3>Hints</h3>
        <ol id="hint-list"></ol>
      </aside>
    </div>

    <div id="status-bar">
      <span id="question-counter">Question 0 / 21</span>
      <span id="status-activity">
        <span id="status-mark" hidden>
          <svg viewBox="0 0 270 180" aria-hidden="true">
            <g fill="none" stroke-linecap="round" stroke-width="9" class="mark-flow">
              <path d="M20 24C117 24 131 90 249 90" stroke="#e0e0e0"/>
              <path d="M20 68C120 68 143 90 249 90" stroke="#b0b0b0"/>
              <path d="M20 112C120 112 143 90 249 90" stroke="#7e7e7e"/>
              <path d="M20 156C117 156 131 90 249 90" stroke="#555568"/>
            </g>
            <circle cx="249" cy="90" r="16" fill="#e2b714" class="mark-answer"/>
          </svg>
        </span>
        <span id="status-text"></span>
      </span>
    </div>

    <form id="ask-form">
      <textarea
        id="question-input"
        placeholder="Ask a yes/no question or make a guess..."
        autocomplete="off"
        maxlength="500"
        required
        rows="1"
      ></textarea>
      <button type="submit" id="submit-btn">Ask</button>
      <button type="button" id="concede-btn">Give up</button>
    </form>
  </main>
  <script src="/static/nav.js"></script>
  <script src="/static/game.js"></script>
</body>
</html>
