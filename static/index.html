<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/h21-favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/static/brand/h21-favicon.svg">
  <link rel="apple-touch-icon" href="/static/brand/h21-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>H21 — 21 Questions</title>
  <meta property="og:title" content="H21 — 21 Questions">
  <meta property="og:description" content="A daily 21 Questions trivia game powered by AI.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="__BASE_URL__/static/brand/h21-og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="game-page">
  <header class="top-bar game-top-bar">
    <div class="top-bar-inner">
      <a class="game-back" href="/" aria-label="Back to today's puzzles">
        <svg class="game-back-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        <img class="game-back-mark" src="/static/brand/h21-mark.svg" alt="" width="270" height="180">
      </a>
      <div class="game-title">
        <span class="game-topic" id="game-topic"></span>
        <span class="difficulty-pill" id="game-difficulty"></span>
      </div>
      <button type="button" class="text-btn" id="concede-btn">Give up</button>
    </div>
    <div class="question-meter" id="question-meter" role="img" aria-label="Questions used"></div>
  </header>

  <main class="page game-main">
    <section id="game-intro" class="game-intro" hidden>
      <p class="game-intro-lead">
        I'm thinking of something from <strong id="game-intro-topic"></strong>.
        Work out what it is in 21 yes-or-no questions.
      </p>
    </section>

    <div id="question-log" aria-live="polite"></div>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <div class="composer-status">
        <button type="button" class="hint-btn" id="hint-btn" hidden></button>
        <span id="status-text" role="status"></span>
        <span id="question-counter"></span>
      </div>
      <form id="ask-form">
        <textarea
          id="question-input"
          placeholder="Ask a yes/no question, or guess"
          autocomplete="off"
          maxlength="500"
          required
          rows="1"
        ></textarea>
        <button type="submit" id="submit-btn" aria-label="Ask">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
    </div>
  </footer>
  <script src="/static/question-log.js"></script>
  <script src="/static/game.js"></script>
</body>
</html>
