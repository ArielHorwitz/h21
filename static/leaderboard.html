<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/h21-favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/static/brand/h21-favicon.svg">
  <link rel="apple-touch-icon" href="/static/brand/h21-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>H21 — Leaderboard</title>
  <meta property="og:title" content="H21 — Leaderboard">
  <meta property="og:description" content="A daily 21 Questions trivia game powered by AI.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="__BASE_URL__/static/brand/h21-og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/tz.js"></script>
</head>
<body data-tab="friends">
  <!--TOP_BAR-->
  <main class="page">
    <header class="page-header">
      <h1 class="page-title" id="leaderboard-title">Leaderboard</h1>
      <p class="page-subtitle" id="leaderboard-meta"></p>
    </header>

    <p id="leaderboard-error" class="empty-state" hidden></p>

    <div id="leaderboard-content" class="leaderboard-content" hidden>
      <div class="segmented" role="tablist">
        <button type="button" role="tab" id="filter-everyone" aria-selected="true">Everyone</button>
        <button type="button" role="tab" id="filter-friends" aria-selected="false">Friends</button>
      </div>
      <ol id="leaderboard-list" class="leaderboard-list"></ol>
      <p id="leaderboard-empty" class="empty-state" hidden>No one has solved this puzzle yet.</p>
    </div>
  </main>
  <!--TAB_BAR-->
  <script src="/static/nav.js"></script>
  <script src="/static/leaderboard.js"></script>
</body>
</html>
