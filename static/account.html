<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%231a1a2e'/><text x='50' y='76' font-size='80' font-weight='bold' font-family='sans-serif' fill='%23e2b714' text-anchor='middle'>H</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H21 — Account</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="nav-bar">
    <a href="/" title="Home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg></a>
    <a href="/help" title="Help"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 9a3 3 0 115.12 2.12C13.24 12 12 12.5 12 14"/><circle cx="12" cy="18" r="0.5" fill="currentColor"/></svg></a>
    <a href="/account" title="Account"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.418 3.582-7 8-7s8 2.582 8 7"/></svg></a>
  </nav>
  <main>
    <h1><a href="/" class="home-link">H21</a></h1>
    <p class="subtitle">Account</p>

    <div id="account-info" class="auth-section">
      <div id="avatar-section">
        <div id="avatar-display">
          <img id="avatar-img" class="avatar-large" alt="Profile picture" hidden>
          <div id="avatar-placeholder" class="avatar-large avatar-placeholder"></div>
        </div>
        <div id="avatar-actions">
          <button type="button" id="avatar-generate-toggle" class="secondary-btn">Change picture</button>
          <a id="avatar-download" class="secondary-btn" download="avatar.png" hidden>Download</a>
        </div>
        <div id="avatar-generator" hidden>
          <div class="settings-field">
            <label>Reference photo (optional)</label>
            <input type="file" id="avatar-reference-input" accept="image/*">
          </div>
          <div class="settings-field">
            <label>Prompt (optional)</label>
            <input type="text" id="avatar-prompt-input" maxlength="500" placeholder="Describe the picture you want...">
          </div>
          <div id="avatar-gen-actions">
            <button type="button" id="avatar-generate-btn">Generate</button>
            <button type="button" id="avatar-cancel-btn" class="secondary-btn">Cancel</button>
            <span id="avatar-gen-counter" class="field-hint"></span>
          </div>
          <p id="avatar-gen-status" class="field-status"></p>
        </div>
        <div id="avatar-preview" hidden>
          <p class="field-hint" style="margin-bottom: 0.5rem;">Preview:</p>
          <div id="avatar-preview-images">
            <div>
              <img id="avatar-preview-original" class="avatar-large" alt="Full size preview">
              <span class="field-hint">Full size</span>
            </div>
            <div>
              <img id="avatar-preview-thumb-48" class="avatar-sm" alt="Leaderboard preview" style="width: 48px; height: 48px;">
              <span class="field-hint">In lists</span>
            </div>
            <div>
              <img id="avatar-preview-thumb-32" class="avatar-xs" alt="Nav preview" style="width: 32px; height: 32px;">
              <span class="field-hint">In nav</span>
            </div>
          </div>
          <div id="avatar-confirm-actions">
            <button type="button" id="avatar-use-btn">Use this</button>
            <button type="button" id="avatar-retry-btn" class="secondary-btn">Try again</button>
            <button type="button" id="avatar-discard-btn" class="secondary-btn">Cancel</button>
          </div>
        </div>
      </div>
      <div class="settings-field">
        <label>Username</label>
        <p id="account-username" class="account-value"></p>
      </div>
      <div class="settings-field">
        <label>Display Name</label>
        <div class="profile-inline-edit">
          <input type="text" id="display-name-input" maxlength="40" placeholder="(same as username)">
          <button type="button" id="save-display-name-btn" class="secondary-btn">Save</button>
        </div>
        <p id="display-name-status" class="field-status"></p>
      </div>
      <div class="settings-field">
        <label>Player Code</label>
        <div class="profile-inline-edit">
          <span id="player-code-value" class="account-value player-code-text"></span>
          <button type="button" id="copy-code-btn" class="secondary-btn">Copy</button>
        </div>
      </div>
      <div class="settings-field">
        <label class="toggle-label">
          <input type="checkbox" id="anonymous-toggle">
          <span>Anonymous mode</span>
        </label>
        <p class="field-hint">Hides you from others and disables social features.</p>
      </div>
      <div class="settings-actions">
        <a href="/control" id="control-link" class="secondary-btn" hidden>Control Panel</a>
        <button type="button" id="logout-btn">Log out</button>
        <button type="button" id="back-btn" class="secondary-btn">Back</button>
      </div>
    </div>

    <div id="friends-section" class="auth-section" style="margin-top: 1.5rem;">
      <h2>Friends</h2>
      <div id="friends-disabled-message" hidden>
        <p class="field-hint">Social features are disabled while anonymous mode is on.</p>
      </div>
      <div id="friends-controls">
        <div class="settings-field">
          <label>Add by player code</label>
          <div class="profile-inline-edit">
            <input type="text" id="add-friend-input" placeholder="e.g. A1B2" style="text-transform: uppercase; font-family: monospace;">
            <button type="button" id="add-friend-btn">Add</button>
          </div>
          <p id="add-friend-status" class="field-status"></p>
        </div>
        <div class="settings-field">
          <label>Search players</label>
          <input type="text" id="search-players-input" placeholder="Search by name...">
          <div id="search-results"></div>
        </div>
        <div id="friends-list-container">
          <label>Following</label>
          <div id="friends-list"></div>
        </div>
      </div>
    </div>

    <div id="history-section" class="auth-section" style="margin-top: 1.5rem;" hidden>
      <h2>Game History</h2>
      <div id="history-list"></div>
    </div>
  </main>
  <script src="/static/account.js"></script>
</body>
</html>
