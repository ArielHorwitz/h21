<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/h21-favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/static/brand/h21-favicon.svg">
  <link rel="apple-touch-icon" href="/static/brand/h21-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>Profile — H21</title>
  <meta property="og:title" content="H21 — Account">
  <meta property="og:description" content="A daily 21 Questions trivia game powered by AI.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="__BASE_URL__/static/brand/h21-og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-tab="profile">
  <!--TOP_BAR-->
  <main class="page">
    <section class="profile-card">
      <div id="avatar-section">
        <div id="avatar-display">
          <img id="avatar-img" class="avatar-large" alt="Profile picture" hidden>
          <div id="avatar-placeholder" class="avatar-large avatar-placeholder"></div>
        </div>
        <div id="avatar-actions">
          <button type="button" id="avatar-generate-toggle" class="secondary-btn">Change picture</button>
        </div>
        <div id="avatar-generator" hidden>
          <div class="settings-field">
            <label>Reference photo (optional)</label>
            <input type="file" id="avatar-reference-input" accept="image/*">
          </div>
          <div class="settings-field">
            <label>Prompt (optional)</label>
            <input type="text" id="avatar-prompt-input" maxlength="500" placeholder="Describe the picture you want...">
          </div>
          <div id="avatar-gen-actions">
            <button type="button" id="avatar-generate-btn" class="primary-btn">Generate</button>
            <button type="button" id="avatar-cancel-btn" class="secondary-btn">Cancel</button>
          </div>
          <p class="quota-note avatar-quota"></p>
          <p id="avatar-gen-status" class="field-status"></p>
        </div>
        <div id="avatar-preview" hidden>
          <p class="field-hint" style="margin-bottom: 0.5rem;">Preview:</p>
          <div id="avatar-preview-images">
            <div>
              <img id="avatar-preview-original" class="avatar-large" alt="Full size preview">
              <span class="field-hint">Full size</span>
            </div>
            <div>
              <img id="avatar-preview-thumb-48" class="avatar-sm" alt="Leaderboard preview" style="width: 48px; height: 48px;">
              <span class="field-hint">In lists</span>
            </div>
            <div>
              <img id="avatar-preview-thumb-32" class="avatar-xs" alt="Nav preview" style="width: 32px; height: 32px;">
              <span class="field-hint">In nav</span>
            </div>
          </div>
          <div id="avatar-confirm-actions">
            <button type="button" id="avatar-use-btn" class="primary-btn">Use this</button>
            <button type="button" id="avatar-retry-btn" class="secondary-btn">Try again</button>
            <button type="button" id="avatar-discard-btn" class="secondary-btn">Cancel</button>
          </div>
          <p class="quota-note avatar-quota"></p>
        </div>
      </div>
      <div class="profile-identity">
        <div class="profile-name-row">
          <input type="text" id="display-name-input" class="profile-name-input" maxlength="40" aria-label="Display name">
          <button type="button" id="save-display-name-btn" class="secondary-btn small-btn" hidden>Save</button>
        </div>
        <p class="profile-meta">@<span id="account-username"></span> · code <span id="player-code-value" class="player-code-text"></span></p>
        <p id="display-name-status" class="field-status"></p>
      </div>
    </section>

    <section class="stats-grid" id="stats-grid" hidden>
      <div class="stat"><span class="stat-value" id="stat-played">0</span><span class="stat-label">Played</span></div>
      <div class="stat"><span class="stat-value" id="stat-solved">0%</span><span class="stat-label">Solved</span></div>
      <div class="stat"><span class="stat-value" id="stat-average">–</span><span class="stat-label">Avg. questions</span></div>
    </section>

    <section id="history-section" hidden>
      <div class="section-header">
        <h2 class="section-title">History</h2>
      </div>
      <div id="history-list" class="history-list"></div>
      <button type="button" class="text-btn show-more-btn" id="history-more-btn" hidden>Show more</button>
    </section>

    <section class="settings-list">
      <h2 class="section-title">Settings</h2>
      <label class="setting-row">
        <span class="setting-text">
          <span>Anonymous mode</span>
          <span class="field-hint">Hide your name and results from others, and turn off social features.</span>
        </span>
        <input type="checkbox" id="anonymous-toggle" class="switch">
      </label>
      <a href="/control" id="control-link" class="setting-row setting-link" hidden>
        <span>Control panel</span><span aria-hidden="true">›</span>
      </a>
      <button type="button" id="logout-btn" class="setting-row setting-link logout-row">Log out</button>
    </section>
  </main>
  <!--TAB_BAR-->
  <script src="/static/nav.js"></script>
  <script src="/static/account.js"></script>
</body>
</html>
