<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/h21-favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/static/brand/h21-favicon.svg">
  <link rel="apple-touch-icon" href="/static/brand/h21-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>H21 — Replay</title>
  <meta property="og:title" content="H21 — Replay">
  <meta property="og:description" content="A daily 21 Questions trivia game powered by AI.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="__BASE_URL__/static/brand/h21-og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/tz.js"></script>
</head>
<body data-tab="results">
  <!--TOP_BAR-->
  <main class="page">
    <p id="replay-error" class="empty-state" hidden></p>

    <section id="replay-gated" class="result-card" hidden>
      <p class="result-eyebrow" id="gated-meta"></p>
      <h1 class="result-heading">Spoilers ahead</h1>
      <p class="result-lead" id="gated-message"></p>
      <div class="result-actions">
        <a id="gated-play-btn" class="primary-btn" href="#">Play this puzzle</a>
      </div>
    </section>

    <section id="replay-summary" class="result-card" hidden>
      <p class="result-eyebrow" id="result-meta"></p>
      <h1 class="result-heading" id="result-heading"></h1>
      <p class="result-solution-label">The solution was</p>
      <p class="result-solution" id="result-solution"></p>
      <div class="question-meter result-meter" id="result-meter" role="img"></div>
      <p class="result-stats" id="result-stats"></p>
      <div class="result-actions" id="result-actions"></div>
    </section>

    <section id="replay-log-section" hidden>
      <div class="section-header">
        <h2 class="section-title">Questions</h2>
        <button type="button" class="text-btn" id="toggle-reasoning-btn" hidden>Show all reasoning</button>
      </div>
      <div id="question-log"></div>
      <details id="unrevealed-hints" class="unrevealed-hints" hidden>
        <summary>Hints that weren't used</summary>
        <ol id="unrevealed-hint-list"></ol>
      </details>
    </section>
  </main>
  <!--TAB_BAR-->
  <script src="/static/nav.js"></script>
  <script src="/static/question-log.js"></script>
  <script src="/static/replay.js"></script>
</body>
</html>
