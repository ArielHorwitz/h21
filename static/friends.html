<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/h21-favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/static/brand/h21-favicon.svg">
  <link rel="apple-touch-icon" href="/static/brand/h21-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>Friends — H21</title>
  <meta property="og:title" content="H21 — 21 Questions">
  <meta property="og:description" content="A daily 21 Questions trivia game powered by AI.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="__BASE_URL__/static/brand/h21-og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-tab="friends">
  <!--TOP_BAR-->
  <main class="page">
    <header class="page-header">
      <h1 class="page-title">Friends</h1>
    </header>

    <p id="anonymous-notice" class="empty-state" hidden>
      Friends are turned off while you're in anonymous mode.
      You can change this on your <a href="/account">profile</a>.
    </p>

    <div id="social-content" hidden>
      <section id="recent-results-section" hidden></section>

      <section class="find-friends">
        <h2 class="section-title">Find friends</h2>
        <div class="my-code">
          <span>Your player code</span>
          <strong id="my-player-code" class="player-code-text"></strong>
          <button type="button" class="secondary-btn small-btn" id="copy-code-btn">Copy</button>
        </div>
        <input type="search" id="search-players-input" placeholder="Search by name or player code" autocomplete="off">
        <div id="search-results" class="person-list"></div>
      </section>

      <section id="friend-suggestions-section" hidden>
        <h2 class="section-title">People you may know</h2>
        <div id="friend-suggestions-list" class="person-list"></div>
      </section>

      <section id="following-section">
        <h2 class="section-title">Following</h2>
        <div id="following-list" class="person-list"></div>
      </section>
    </div>
  </main>
  <!--TAB_BAR-->
  <script src="/static/nav.js"></script>
  <script src="/static/friends.js"></script>
</body>
</html>
