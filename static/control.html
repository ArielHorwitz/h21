<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/h21-favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/static/brand/h21-favicon.svg">
  <link rel="apple-touch-icon" href="/static/brand/h21-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>H21 — Control Panel</title>
  <meta property="og:title" content="H21 — Control Panel">
  <meta property="og:description" content="A daily 21 Questions trivia game powered by AI.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="__BASE_URL__/static/brand/h21-og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/tz.js"></script>
</head>
<body data-tab="admin">
  <!--TOP_BAR-->
  <main class="page page-wide">
    <header class="page-header">
      <h1 class="page-title">Control panel</h1>
    </header>

    <nav class="control-tabs" role="tablist" aria-label="Control panel sections">
      <button type="button" role="tab" data-panel="invites">Invites</button>
      <button type="button" role="tab" data-panel="topics">Topics</button>
      <button type="button" role="tab" data-panel="users">Users</button>
      <button type="button" role="tab" data-panel="activity">Activity</button>
      <button type="button" role="tab" data-panel="query">Query</button>
      <button type="button" role="tab" data-panel="logs">Logs</button>
    </nav>

    <div class="control-section" data-panel="invites">
      <h2 id="invite-requests-heading">Invite requests</h2>
      <div id="invite-requests-list"></div>
    </div>

    <div class="control-section" data-panel="invites">
      <h2 id="open-signups-heading">Open sign-ups</h2>
      <p class="field-hint" id="open-signups-usage"></p>
      <form id="settings-form">
        <div class="control-row">
          <div class="settings-field">
            <label for="setting-open_signups_per_day">Per day (0 = off)</label>
            <input type="number" id="setting-open_signups_per_day" data-setting="open_signups_per_day" min="0" max="10000" required>
          </div>
          <div class="settings-field">
            <label for="setting-open_signup_daily_question_limit">Questions / day</label>
            <input type="number" id="setting-open_signup_daily_question_limit" data-setting="open_signup_daily_question_limit" min="0" max="10000" required>
          </div>
          <div class="settings-field">
            <label for="setting-open_signup_daily_topic_limit">Topics / day</label>
            <input type="number" id="setting-open_signup_daily_topic_limit" data-setting="open_signup_daily_topic_limit" min="0" max="1000" required>
          </div>
          <div class="settings-field">
            <label for="setting-open_signup_monthly_avatar_limit">Pictures / month</label>
            <input type="number" id="setting-open_signup_monthly_avatar_limit" data-setting="open_signup_monthly_avatar_limit" min="0" max="1000" required>
          </div>
        </div>
        <button type="submit" class="primary-btn">Save</button>
        <p id="settings-status" hidden></p>
      </form>
    </div>

    <div class="control-section" data-panel="invites">
      <h2>Create invite</h2>
      <form id="create-invite-form">
        <div class="control-row">
          <div class="settings-field">
            <label for="invite-alias">Alias (optional)</label>
            <input type="text" id="invite-alias" placeholder="e.g. friends, beta" autocomplete="off" maxlength="40">
          </div>
          <div class="settings-field">
            <label for="invite-uses">Uses</label>
            <input type="number" id="invite-uses" value="1" min="1" max="1000">
          </div>
          <div class="settings-field">
            <label for="invite-role">Role</label>
            <select id="invite-role">
              <option value="user" selected>user</option>
              <option value="dev">dev</option>
            </select>
          </div>
          <div class="settings-field">
            <label for="invite-question-limit">Question limit</label>
            <input type="number" id="invite-question-limit" min="1" max="10000">
          </div>
          <div class="settings-field">
            <label for="invite-topic-limit">Topic limit</label>
            <input type="number" id="invite-topic-limit" min="0" max="1000">
          </div>
        </div>
        <button type="submit" id="create-invite-btn" class="primary-btn">Create</button>
        <p id="create-invite-status" hidden></p>
      </form>
    </div>

    <div class="control-section" data-panel="invites">
      <h2>Invites</h2>
      <div id="invites-list"></div>
    </div>

    <div class="control-section" data-panel="topics">
      <h2>Series</h2>
      <p class="field-hint">Each topic at each difficulty. Flagged series come first.</p>
      <div id="series-list"></div>
    </div>

    <div class="control-section" data-panel="activity">
      <h2>Activity log</h2>
      <div id="activity-log"></div>
      <button type="button" id="load-more-activity" class="secondary-btn" hidden>Load more</button>
    </div>

    <div class="control-section" data-panel="users">
      <h2>Users</h2>
      <div id="users-list"></div>
    </div>

    <div class="control-section" data-panel="query">
      <h2>Query</h2>
      <form id="query-form">
        <textarea id="query-input" rows="3" placeholder="SELECT * FROM accounts LIMIT 10" spellcheck="false"></textarea>
        <div class="query-buttons">
          <button type="submit" id="query-btn" class="primary-btn">Run</button>
          <button type="button" id="tables-btn" class="secondary-btn">Tables</button>
          <button type="button" id="select-btn" class="secondary-btn">Select</button>
        </div>
      </form>
      <div id="query-result"></div>
    </div>

    <div class="control-section" data-panel="logs">
      <h2>Logs</h2>
      <div class="control-row">
        <div class="settings-field">
          <label for="log-mode">Mode</label>
          <select id="log-mode">
            <option value="tail" selected>tail</option>
            <option value="head">head</option>
          </select>
        </div>
        <div class="settings-field">
          <label for="log-lines">Lines</label>
          <input type="number" id="log-lines" value="100" min="1" max="10000">
        </div>
        <div class="settings-field control-field-action">
          <button type="button" id="load-logs-btn" class="primary-btn">Load</button>
        </div>
      </div>
      <pre id="log-output" class="log-output" hidden></pre>
    </div>
  </main>
  <!--TAB_BAR-->
  <script src="/static/nav.js"></script>
  <script src="/static/control.js"></script>
</body>
</html>
