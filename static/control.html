<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/h21-favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/static/brand/h21-favicon.svg">
  <link rel="apple-touch-icon" href="/static/brand/h21-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>H21 — Control Panel</title>
  <meta property="og:title" content="H21 — Control Panel">
  <meta property="og:description" content="A daily 21 Questions trivia game powered by AI.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="__BASE_URL__/static/brand/h21-og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-tab="profile">
  <!--TOP_BAR-->
  <main class="page page-wide">
    <header class="page-header">
      <h1 class="page-title">Control panel</h1>
    </header>

    <div class="control-section">
      <h2>Create Invite</h2>
      <form id="create-invite-form">
        <div class="control-row">
          <div class="settings-field">
            <label for="invite-alias">Alias (optional)</label>
            <input type="text" id="invite-alias" placeholder="e.g. friends, beta" autocomplete="off" maxlength="40">
          </div>
          <div class="settings-field">
            <label for="invite-uses">Uses</label>
            <input type="number" id="invite-uses" value="1" min="1" max="1000">
          </div>
          <div class="settings-field">
            <label for="invite-role">Role</label>
            <select id="invite-role">
              <option value="user" selected>user</option>
              <option value="dev">dev</option>
            </select>
          </div>
          <div class="settings-field">
            <label for="invite-question-limit">Question limit</label>
            <input type="number" id="invite-question-limit" min="1" max="10000">
          </div>
          <div class="settings-field">
            <label for="invite-topic-limit">Topic limit</label>
            <input type="number" id="invite-topic-limit" min="0" max="1000">
          </div>
        </div>
        <button type="submit" id="create-invite-btn">Create</button>
        <p id="create-invite-status" hidden></p>
      </form>
    </div>

    <div class="control-section">
      <h2>Invites</h2>
      <div id="invites-list"></div>
    </div>

    <div class="control-section">
      <h2>Invite Requests</h2>
      <div id="invite-requests-list"></div>
    </div>

    <div class="control-section">
      <h2>Activity Log</h2>
      <div id="activity-log"></div>
      <button type="button" id="load-more-activity" hidden>Load more</button>
    </div>

    <div class="control-section">
      <h2>Users</h2>
      <div id="users-list"></div>
    </div>

    <div class="control-section">
      <h2>Query</h2>
      <form id="query-form">
        <textarea id="query-input" rows="3" placeholder="SELECT * FROM accounts LIMIT 10" spellcheck="false"></textarea>
        <div class="query-buttons">
          <button type="submit" id="query-btn">Run</button>
          <button type="button" id="tables-btn">Tables</button>
          <button type="button" id="select-btn">Select</button>
        </div>
      </form>
      <div id="query-result"></div>
    </div>

    <div class="control-section">
      <h2>Logs</h2>
      <div class="control-row">
        <div class="settings-field">
          <label for="log-mode">Mode</label>
          <select id="log-mode">
            <option value="tail" selected>tail</option>
            <option value="head">head</option>
          </select>
        </div>
        <div class="settings-field">
          <label for="log-lines">Lines</label>
          <input type="number" id="log-lines" value="100" min="1" max="10000">
        </div>
        <div class="settings-field" style="align-self: end;">
          <button type="button" id="load-logs-btn">Load</button>
        </div>
      </div>
      <pre id="log-output" class="log-output" hidden></pre>
    </div>
  </main>
  <!--TAB_BAR-->
  <script src="/static/nav.js"></script>
  <script src="/static/control.js"></script>
</body>
</html>
