[project]
name = "h21"
version = "0.1.0"
description = "AI-powered 21 questions trivia game"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.0",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
h21 = "h21.main:cli"
h21-reset = "h21.reset:main"
h21-invite = "h21.invite:main"
h21-pool = "h21.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h21"]
